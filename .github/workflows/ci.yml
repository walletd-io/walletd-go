name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor the module declares, and the current release. A public
        # SDK that only builds on the newest toolchain is not usable.
        go: ["1.27", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: go test -tags smoke compiles
        # The smoke suite talks to a live deployment, so CI only proves it
        # still builds; it is run by hand against `make up` or staging.
        run: go vet -tags smoke ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

  codegen-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go.sum
      # types.gen.go is generated from api/openapi.yaml. A drifted checked-in
      # copy means the SDK's types no longer describe the API it calls, which
      # is the one failure this package exists to make impossible.
      - run: go generate ./... && git diff --exit-code

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
