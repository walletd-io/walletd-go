      - rewards_paid
      - points_issued
      - points_redeemed
      - money_in
      - money_out
      properties:
        fees_earned:
          type: integer
          format: int64
          description: Credits to tenant and platform fee accounts.
        previous_fees_earned:
          type: integer
          format: int64
        payment_volume:
          type: integer
          format: int64
        take_rate_bps:
          type: integer
          description: fees_earned over payment_volume, in basis points. Zero when there was no payment
            volume.
        rewards_paid:
          type: integer
          format: int64
          description: Cash leaving marketing accounts as cashback and point conversions.
        points_issued:
          type: integer
          format: int64
        points_redeemed:
          type: integer
          format: int64
        money_in:
          type: integer
          format: int64
          description: Value that entered the loop through treasury (top-ups).
        money_out:
          type: integer
          format: int64
          description: Value that left the loop through treasury (merchant payouts).
    PositionSummary:
      type: object
      description: Snapshot of what the loop holds and owes right now, in the tenant's currency, plus
        the point liability counted separately.
      required:
      - treasury
      - user_cash
      - merchant_settlement
      - fees
      - marketing_pots
      - marketing_drawn
      - suspense
      - credit_extended
      - credit_granted
      - funds_held
      - points_outstanding
      - funded_wallets
      - active_wallets
      properties:
        treasury:
          type: integer
          format: int64
          description: Value that entered the loop and has not left it.
        user_cash:
          type: integer
          format: int64
        merchant_settlement:
          type: integer
          format: int64
        fees:
          type: integer
          format: int64
        marketing_pots:
          type: integer
          format: int64
          description: Funds sitting in marketing accounts, available to spend on rewards.
        marketing_drawn:
          type: integer
          format: int64
          description: Rewards already funded out of a marketing account that carries no balance of its
            own — a tenant subsidy, spent.
        suspense:
          type: integer
          format: int64
        credit_extended:
          type: integer
          format: int64
          description: Sum of the overdrawn user balances — money the loop has lent.
        credit_granted:
          type: integer
          format: int64
          description: Sum of the credit limits on user accounts.
        funds_held:
          type: integer
          format: int64
          description: Active authorisation holds against user balances.
        points_outstanding:
          type: integer
          format: int64
        funded_wallets:
          type: integer
          format: int64
        active_wallets:
          type: integer
          format: int64
          description: Wallets with at least one posting in the window.
