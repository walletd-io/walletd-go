          format: uuid
        variant_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - adjustment
          - import
          - reservation
          - release
          - sale
          - restock
        quantity:
          type: integer
          format: int64
          description: Signed change to the counter the kind names.
        on_hand_after:
          type: integer
          format: int64
        reserved_after:
          type: integer
          format: int64
        reason:
          type: string
        order_id:
          type: string
          format: uuid
        actor_type:
          type: string
        actor_id:
          type: string
        created_at:
          type: string
          format: date-time
    PriceChange:
      type: object
      required:
      - id
      - offering_id
      - variant_id
      - new_amount
      - source
      - created_at
      properties:
        id:
          type: string
          format: uuid
        offering_id:
          type: string
          format: uuid
        variant_id:
          type: string
          format: uuid
        old_amount:
          type: integer
          format: int64
          nullable: true
        new_amount:
          type: integer
          format: int64
        source:
          type: string
          enum:
          - manual
          - markup
          - import
        actor_type:
          type: string
        actor_id:
          type: string
        created_at:
          type: string
          format: date-time
    Category:
      type: object
      required:
      - id
      - name
      - slug
      - position
      - created_at
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        slug:
          type: string
        position:
          type: integer
        created_at:
          type: string
          format: date-time
    CategoryInput:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 96
        parent_id:
          type: string
          format: uuid
          nullable: true
