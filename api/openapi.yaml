          format: int64
        subscriptions_active:
          type: integer
          format: int64
        subscriptions_past_due:
          type: integer
          format: int64
        subscriptions_past_due_amount:
          type: integer
          format: int64
        subscriptions_due_30d_amount:
          type: integer
          format: int64
        subscriptions_mrr:
