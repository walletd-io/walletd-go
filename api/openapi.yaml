          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogImport'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: startCatalogImport
      tags:
      - catalog
      summary: Upload a CSV or XLSX (and optionally a ZIP of images) for preview
      description: Nothing lands until the import is committed. The file is validated in full in the background;
        poll the import until its status is ready, review the rows, then commit. Rows match existing products
        by SKU. Download the template for the column list.
      parameters:
      - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The .csv or .xlsx, at most 10 MB
                images:
                  type: string
                  format: binary
                  description: A .zip of the pictures the image column names, at most 100 MB
      responses:
        '202':
          description: Import accepted for validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogImport'
        default:
          $ref: '#/components/responses/Problem'
