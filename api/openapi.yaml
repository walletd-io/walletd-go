          \ \\\n  -H \"Content-Type: application/json\" \\\n  -H \"Idempotency-Key: payment-order-4471\"\
          \ \\\n  -d '{\"payer_user_id\": \"'$USER_ID'\", \"merchant_id\": \"'$MERCHANT_ID'\",\n     \
          \  \"amount\": 1840, \"mode\": \"instant\"}'\n"
      - lang: Go
        label: Go
        source: "var payment walletd.Payment\nerr := client.Do(ctx, http.MethodPost, \"/v1/payments\"\
          , map[string]any{\n    \"payer_user_id\": payerID,\n    \"merchant_id\":   merchantID,\n   \
          \ \"amount\":        1840,\n    \"mode\":          \"instant\",\n}, &payment, \"payment-\"+orderID)\n"
      - lang: Python
        label: Python
        source: "payment = client.request(\"POST\", \"/v1/payments\", {\n    \"payer_user_id\": payer_id,\n\
          \    \"merchant_id\": merchant_id,\n    \"amount\": 1840,\n    \"mode\": \"instant\",\n}, idempotency_key=f\"\
          payment-{order_id}\")\n"
      - lang: PHP
        label: PHP
        source: "$payment = $client->request('POST', '/v1/payments', [\n    'payer_user_id' => $payerId,\n\
          \    'merchant_id' => $merchantId,\n    'amount' => 1840,\n    'mode' => 'instant',\n], \"payment-{$orderId}\"\
          );\n"
      - lang: JavaScript
        label: JavaScript
        source: "const payment = await client.request(\"POST\", \"/v1/payments\", {\n  body: { payer_user_id:\
          \ payerId, merchant_id: merchantId, amount: 1840, mode: \"instant\" },\n  idempotencyKey: `payment-${orderId}`,\n\
          });\n"
      - lang: Java
        label: Java
        source: "JsonNode payment = client.request(\"POST\", \"/v1/payments\", Map.of(\n        \"payer_user_id\"\
