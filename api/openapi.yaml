      properties:
        id:
          type: string
          format: uuid
        offering_id:
          type: string
          format: uuid
        variant_id:
          type: string
          format: uuid
        title:
          type: string
        variant_title:
          type: string
          description: The option values joined ("L / Red"); absent for a default variant.
        sku:
          type: string
        unit_amount:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int64
        line_amount:
          type: integer
          format: int64
        commission:
          type: integer
          format: int64
    Order:
      type: object
      required:
      - id
      - client_id
      - merchant_id
      - user_id
      - status
      - subtotal
      - commission
      - total
      - expires_at
      - created_at
      - updated_at
      - lines
      description: A cart from one merchant. open holds its stock until expires_at; paying is the moment
        between claiming the order and the payment landing; paid, canceled and expired are final.
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        merchant_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - open
          - paying
          - paid
          - canceled
          - expired
        subtotal:
          type: integer
          format: int64
        commission:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
          description: What the buyer pays; differs from subtotal only when the loop adds commission on
            top.
        payment_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        restocked_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
    OrderLineInput:
      type: object
      required:
      - variant_id
      - quantity
      properties:
        variant_id:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000
    CreateOrderRequest:
      type: object
      required:
      - lines
      description: Lines from one merchant. Prices come from the catalog; the buyer never sends an amount.
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderLineInput'
    OrderPayment:
      type: object
      required:
      - order
      - payment
      properties:
        order:
          $ref: '#/components/schemas/Order'
        payment:
          $ref: '#/components/schemas/Payment'
    CatalogImport:
      type: object
      required:
      - id
      - client_id
      - status
      - file_name
      - has_images
      - row_count
      - create_count
      - update_count
      - error_count
      - applied_count
      - created_at
      - updated_at
      description: 'A bulk import. validating: the file is being parsed and previewed; ready: the preview
        is complete and the merchant may commit or cancel; committing: the rows are being applied; done,
        failed and canceled are final. error is the fatal reason for failed; row problems are on the rows.'
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - validating
          - ready
          - committing
          - done
          - failed
          - canceled
        file_name:
          type: string
        has_images:
          type: boolean
        row_count:
          type: integer
        create_count:
          type: integer
        update_count:
          type: integer
        error_count:
          type: integer
        applied_count:
          type: integer
        error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        committed_at:
          type: string
          format: date-time
    CatalogImportRow:
      type: object
      required:
      - row_no
      - action
      - payload
      - errors
      - applied
      properties:
        row_no:
          type: integer
          description: The spreadsheet line, header being line 1.
        action:
          type: string
          enum:
          - create
          - update
          - error
        sku:
          type: string
        product_handle:
          type: string
        title:
          type: string
        payload:
          type: object
          additionalProperties: true
          description: The row as the parser understood it.
        errors:
          type: array
          items:
            type: string
        image_url:
          type: string
          description: The stored public image this row will use.
        applied:
          type: boolean
    MerchantApiKey:
      type: object
      required:
      - id
      - env
      - name
      - scopes
      - status
      - created_at
      description: An API key bound to one merchant. It acts as that merchant on every /v1/clients/{clientId}
        route and carries no tenant-wide scope. The token itself is returned once, at issuance.
      properties:
        id:
          type: string
          format: uuid
        env:
          type: string
          enum:
          - sandbox
          - live
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
          - active
          - revoked
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
    IssuedMerchantApiKey:
      type: object
      required:
      - key
      - token
      properties:
        key:
          $ref: '#/components/schemas/MerchantApiKey'
        token:
          type: string
          description: Shown once. Store it in your system's secret store now.
    IssueMerchantApiKeyRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: What system will hold it (e.g. "Shopify sync", "POS till 2").
        env:
          type: string
          enum:
          - sandbox
          - live
          default: live
    CreateOfferingRequest:
      type: object
      required:
      - kind
      - title
      properties:
        kind:
          type: string
          enum:
          - item
          - plan
        title:
          type: string
          minLength: 1
          maxLength: 256
        description:
          type: string
          maxLength: 2048
        amount:
          type: integer
          format: int64
          minimum: 1
          description: The plan price, or the price of an item's default variant when no variants are
            given. Ignored when variants are given.
        image_url:
          type: string
          maxLength: 512
        metadata:
          type: object
          additionalProperties:
            type: string
        interval:
          type: string
          enum:
          - weekly
          - monthly
          description: Required for plans, forbidden for items
        category_id:
          type: string
          format: uuid
          nullable: true
        options:
          type: array
          maxItems: 3
          items:
            type: string
            maxLength: 64
          description: Variant axes; a product with options must list its variants.
        markup:
          $ref: '#/components/schemas/Markup'
        variants:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/VariantInput'
