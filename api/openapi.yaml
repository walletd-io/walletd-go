openapi: 3.0.3
info:
  title: WaaS API
  description: 'Semi-closed wallet service. Spec v0: health and users.

    Money is always integer minor units. Errors are RFC 7807 problem+json.

    Money-moving POSTs require an Idempotency-Key header.

    '
  version: 0.8.0
servers:
- url: https://apigw.walletd.io
  description: Replace with your deployment's API host
security:
- bearerAuth: []
paths:
  /healthz:
    get:
      operationId: getHealth
      tags:
      - system
      security: []
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/tenants:
    post:
      operationId: createTenant
      tags:
      - platform
      summary: Provision a tenant with its system accounts (platform staff only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: Tenant provisioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: listTenants
      tags:
      - platform
      summary: List tenants (platform staff only)
      responses:
        '200':
          description: Tenants, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tenant'
        default:
          $ref: '#/components/responses/Problem'
  /v1/tenants/{tenantId}/summary:
    get:
      operationId: getTenantSummary
      tags:
      - platform
      summary: Per-tenant health snapshot — balances, fee plan, ledger invariants (platform staff only)
      parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Health snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSummary'
        default:
          $ref: '#/components/responses/Problem'
  /v1/platform/overview:
    get:
      operationId: getPlatformOverview
      tags:
      - platform
      summary: Whole-platform ledger view — every tenant's position and health (global admin only)
      description: One row per tenant with its user count, 30-day movement, treasury float, outstanding
        liabilities and whether its books net to zero, plus totals per currency. Amounts are minor units
        of each tenant's own currency and are never summed across currencies.
      responses:
        '200':
          description: Per-tenant positions and per-currency totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOverview'
        default:
          $ref: '#/components/responses/Problem'
  /v1/platform/clients:
    get:
      operationId: listPlatformClients
      tags:
      - platform
      summary: Ecosystem clients across all tenants, the review queue (global admin only)
      parameters:
      - $ref: '#/components/parameters/TenantFilter'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/CatalogClientStatus'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Clients across all tenants, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlatformClient'
        default:
          $ref: '#/components/responses/Problem'
  /v1/platform/clients/{clientId}/approve:
    post:
      operationId: approveClient
      tags:
      - platform
      summary: Let a pending client publish to Explore (platform staff only)
      parameters:
      - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Client approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogClient'
        default:
          $ref: '#/components/responses/Problem'
  /v1/platform/clients/{clientId}/suspend:
    post:
      operationId: suspendClient
      tags:
      - platform
      summary: Hide a client's whole catalog from Explore (platform staff only)
      description: 'Suspension is moderation, not confiscation: the catalog disappears from Explore while
        settled money stays settled and a payout still works.'
      parameters:
      - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Client suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogClient'
        default:
          $ref: '#/components/responses/Problem'
  /v1/platform/transactions:
    get:
      operationId: listPlatformTransactions
      tags:
      - platform
      summary: Cross-tenant transaction explorer (global admin only)
      parameters:
      - $ref: '#/components/parameters/TenantFilter'
      - name: type
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Transactions across all tenants, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlatformTransaction'
        default:
          $ref: '#/components/responses/Problem'
  /v1/platform/users:
    get:
      operationId: listPlatformUsers
      tags:
      - platform
      summary: Wallet users across all tenants (global admin only)
      parameters:
      - $ref: '#/components/parameters/TenantFilter'
      - name: query
        in: query
        schema:
          type: string
          maxLength: 128
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Users across all tenants, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlatformUser'
        default:
          $ref: '#/components/responses/Problem'
  /v1/platform/subscriptions:
    get:
      operationId: listPlatformSubscriptions
      tags:
      - platform
      summary: Subscriptions across all tenants (global admin only)
      parameters:
      - $ref: '#/components/parameters/TenantFilter'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/SubscriptionStatus'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Subscriptions across all tenants, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlatformSubscription'
        default:
          $ref: '#/components/responses/Problem'
  /v1/me:
    get:
      operationId: getMe
      tags:
      - users
      summary: Resolve the calling user token to its wallet user
      responses:
        '200':
          description: The caller's own user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
  /v1/users:
    get:
      operationId: listUsers
      tags:
      - users
      summary: Search and page the tenant's users (admin)
      parameters:
      - name: query
        in: query
        schema:
          type: string
          maxLength: 128
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Users, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createUser
      tags:
      - users
      summary: Create or attach a wallet user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -sS -X POST \"$WALLETD_API/v1/users\" \\\n  -H \"Authorization: Bearer $WALLETD_API_KEY\"\
          \ \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"external_id\": \"user-42\", \"kind\"\
          : \"consumer\", \"handle\": \"ada\"}'\n"
      - lang: Go
        label: Go
        source: "var user walletd.User\nerr := client.Do(ctx, http.MethodPost, \"/v1/users\", map[string]any{\n\
          \    \"external_id\": \"user-42\",\n    \"kind\":        \"consumer\",\n    \"handle\":    \
          \  \"ada\",\n}, &user, \"\")\n"
      - lang: Python
        label: Python
        source: "user = client.request(\"POST\", \"/v1/users\", {\n    \"external_id\": \"user-42\",\n\
          \    \"kind\": \"consumer\",\n    \"handle\": \"ada\",\n})\n"
      - lang: PHP
        label: PHP
        source: "$user = $client->request('POST', '/v1/users', [\n    'external_id' => 'user-42',\n  \
          \  'kind' => 'consumer',\n    'handle' => 'ada',\n]);\n"
      - lang: JavaScript
        label: JavaScript
        source: "const user = await client.request(\"POST\", \"/v1/users\", {\n  body: { external_id:\
          \ \"user-42\", kind: \"consumer\", handle: \"ada\" },\n});\n"
      - lang: Java
        label: Java
        source: "JsonNode user = client.request(\"POST\", \"/v1/users\", Map.of(\n        \"external_id\"\
          , \"user-42\",\n        \"kind\", \"consumer\",\n        \"handle\", \"ada\"), null);\n"
  /v1/users/{userId}:
    get:
      operationId: getUser
      tags:
      - users
      summary: Fetch a wallet user
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Problem'
  /v1/users/{userId}/balances:
    get:
      operationId: getUserBalances
      tags:
      - users
      summary: List a user's balances per account purpose
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserBalance'
        default:
          $ref: '#/components/responses/Problem'
  /v1/users/{userId}/transactions:
    get:
      operationId: listUserTransactions
      tags:
      - users
      summary: A user's ledger history across cash and points
      parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Entries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserTransaction'
        default:
          $ref: '#/components/responses/Problem'
  /v1/transactions:
    get:
      operationId: listTransactions
      tags:
      - ledger
      summary: Tenant-wide transaction explorer with resolved legs (admin)
      parameters:
      - name: type
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Transactions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        default:
          $ref: '#/components/responses/Problem'
  /v1/ledger/summary:
    get:
      operationId: getLedgerSummary
      tags:
      - ledger
      summary: Balance totals per owner type and purpose — the float equation view (admin)
      responses:
        '200':
          description: Summary rows plus the tenant's fee plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerSummary'
        default:
          $ref: '#/components/responses/Problem'
  /v1/ledger/metrics:
    get:
      operationId: getLedgerMetrics
      tags:
      - ledger
      summary: Money movement, revenue, exposure and reconciliation for a period (admin)
      description: The reporting view behind the console dashboard. Balances alone answer "what is the
        loop holding right now"; this answers "how much money did the loop move, what did it earn on it,
        what is it exposed to, and do the books still net to zero".
      parameters:
      - name: window
        in: query
        description: Reporting period ending now. The previous period of the same length is returned alongside
          for comparison.
        schema:
          type: string
          enum:
          - 24h
          - 7d
          - 30d
          - 90d
          default: 30d
      responses:
        '200':
          description: Period metrics for the caller's tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerMetrics'
        '503':
          description: '`reporting_timeout`. This view aggregates every ledger entry inside its window,
            so its cost grows with how much money the loop moved rather than with the size of the window
            asked for. On a busy loop it can exceed the time budget, and it says so instead of returning
            an opaque failure or a truncated response. Retry with a narrower window. Expected on high-volume
            tenants rather than exceptional, so a client should handle it as a normal outcome of asking
            for a wide window.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/fee_plan:
    put:
      operationId: updateFeePlan
      tags:
      - ledger
      summary: Update the tenant fee plan (audited; admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFeePlanRequest'
      responses:
        '200':
          description: Updated fee plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeePlan'
        default:
          $ref: '#/components/responses/Problem'
  /v1/audit_log:
    get:
      operationId: listAuditLog
      tags:
      - ledger
      summary: Tenant audit trail (admin)
      parameters:
      - name: action
        in: query
        schema:
          type: string
      - name: cursor
        in: query
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Audit entries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEntry'
        default:
          $ref: '#/components/responses/Problem'
  /v1/support_access_grants:
    get:
      operationId: listSupportAccessGrants
      tags:
      - operations
      summary: List WalletD vendor-support approvals (partner admin only)
      description: Expired and revoked grants remain in the response as operational and audit evidence.
        A partner's own support role does not use these grants.
      parameters:
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Support-access grant history, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupportAccessGrant'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createSupportAccessGrant
      tags:
      - operations
      summary: Approve short-lived WalletD vendor-support access (partner admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupportAccessGrantRequest'
      responses:
        '201':
          description: Support access granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportAccessGrant'
        default:
          $ref: '#/components/responses/Problem'
  /v1/support_access_grants/current:
    get:
      operationId: getCurrentSupportAccessGrant
      tags:
      - operations
      summary: Get the calling WalletD vendor-support identity's active grant
      description: This is the only tenant endpoint a WalletD vendor-support identity may call without
        an active grant. It lets the console present a clear waiting-for-approval state instead of failing
        into an error page.
      responses:
        '200':
          description: The active grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportAccessGrant'
        default:
          $ref: '#/components/responses/Problem'
  /v1/support_access_grants/{grantId}/revoke:
    post:
      operationId: revokeSupportAccessGrant
      tags:
      - operations
      summary: Revoke WalletD vendor-support access immediately (partner admin only)
      parameters:
      - name: grantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Revoked grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportAccessGrant'
        default:
          $ref: '#/components/responses/Problem'
  /v1/webhook_deliveries:
    get:
      operationId: listWebhookDeliveries
      tags:
      - webhooks
      summary: Delivery attempt log (admin)
      parameters:
      - name: endpoint_id
        in: query
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Delivery attempts, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookDelivery'
        default:
          $ref: '#/components/responses/Problem'
  /v1/reward_rules/{ruleId}/disable:
    post:
      operationId: disableRewardRule
      tags:
      - rewards
      summary: Disable a reward rule; existing grants stand
      parameters:
      - name: ruleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Rule disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardRule'
        default:
          $ref: '#/components/responses/Problem'
  /v1/transfers:
    post:
      operationId: createTransfer
      tags:
      - transfers
      summary: P2P transfer between users in the tenant loop
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferRequest'
      responses:
        '201':
          description: Transfer completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        default:
          $ref: '#/components/responses/Problem'
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -sS -X POST \"$WALLETD_API/v1/transfers\" \\\n  -H \"Authorization: Bearer $WALLETD_API_KEY\"\
          \ \\\n  -H \"Content-Type: application/json\" \\\n  -H \"Idempotency-Key: transfer-order-8891\"\
          \ \\\n  -d '{\"from_user\": \"'$SENDER'\", \"to_alias\": {\"handle\": \"ada\"}, \"amount\":\
          \ 1500}'\n"
      - lang: Go
        label: Go
        source: "// The key comes from the order, so every retry of this order reuses it.\nvar txn walletd.Transfer\n\
          err := client.Do(ctx, http.MethodPost, \"/v1/transfers\", map[string]any{\n    \"from_user\"\
          : senderID,\n    \"to_alias\":  map[string]string{\"handle\": \"ada\"},\n    \"amount\":   \
          \ 1500,\n}, &txn, \"transfer-\"+orderID)\n"
      - lang: Python
        label: Python
        source: "txn = client.request(\"POST\", \"/v1/transfers\", {\n    \"from_user\": sender_id,\n\
          \    \"to_alias\": {\"handle\": \"ada\"},\n    \"amount\": 1500,\n}, idempotency_key=f\"transfer-{order_id}\"\
          )\n"
      - lang: PHP
        label: PHP
        source: "$txn = $client->request('POST', '/v1/transfers', [\n    'from_user' => $senderId,\n \
          \   'to_alias' => ['handle' => 'ada'],\n    'amount' => 1500,\n], \"transfer-{$orderId}\");\n"
      - lang: JavaScript
        label: JavaScript
        source: "const txn = await client.request(\"POST\", \"/v1/transfers\", {\n  body: { from_user:\
          \ senderId, to_alias: { handle: \"ada\" }, amount: 1500 },\n  idempotencyKey: `transfer-${orderId}`,\n\
          });\n"
      - lang: Java
        label: Java
        source: "JsonNode txn = client.request(\"POST\", \"/v1/transfers\", Map.of(\n        \"from_user\"\
          , senderId,\n        \"to_alias\", Map.of(\"handle\", \"ada\"),\n        \"amount\", 1500L),\
          \ \"transfer-\" + orderId);\n"
  /v1/topup_methods:
    get:
      operationId: listTopupMethods
      tags:
      - topups
      summary: The configured top-up gateways, for client UIs picking a rail
      responses:
        '200':
          description: Available methods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopupMethod'
        default:
          $ref: '#/components/responses/Problem'
  /v1/topups:
    post:
      operationId: createTopup
      tags:
      - topups
      summary: Start a top-up through a payment gateway
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTopupRequest'
      responses:
        '201':
          description: Top-up intent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topup'
        default:
          $ref: '#/components/responses/Problem'
      x-codeSamples:
      - lang: curl
        label: curl
        source: "# Creating an intent does NOT credit the wallet. The balance moves when\n# the processor\
          \ confirms, over a verified webhook or /refresh.\ncurl -sS -X POST \"$WALLETD_API/v1/topups\"\
          \ \\\n  -H \"Authorization: Bearer $WALLETD_API_KEY\" \\\n  -H \"Content-Type: application/json\"\
          \ \\\n  -H \"Idempotency-Key: topup-cart-8891\" \\\n  -d '{\"user_id\": \"'$USER_ID'\", \"amount\"\
          : 5000, \"gateway\": \"stripe\"}'\n"
      - lang: Go
        label: Go
        source: "// amount is minor units: 5000 is $50.00.\nvar topup walletd.Topup\nerr := client.Do(ctx,\
          \ http.MethodPost, \"/v1/topups\", map[string]any{\n    \"user_id\": userID,\n    \"amount\"\
          :  5000,\n    \"gateway\": gateway, // from GET /v1/topup_methods, never hard-coded\n}, &topup,\
          \ \"topup-cart-\"+cartID)\n"
      - lang: Python
        label: Python
        source: "# gateway comes from GET /v1/topup_methods, never hard-coded.\ntopup = client.request(\"\
          POST\", \"/v1/topups\", {\n    \"user_id\": user_id,\n    \"amount\": 5000,  # $50.00\n    \"\
          gateway\": gateway,\n}, idempotency_key=f\"topup-cart-{cart_id}\")\n"
      - lang: PHP
        label: PHP
        source: "$topup = $client->request('POST', '/v1/topups', [\n    'user_id' => $userId,\n    'amount'\
          \ => 5000, // $50.00\n    'gateway' => $gateway,\n], \"topup-cart-{$cartId}\");\n"
      - lang: JavaScript
        label: JavaScript
        source: "const topup = await client.request(\"POST\", \"/v1/topups\", {\n  body: { user_id: userId,\
          \ amount: 5000, gateway }, // $50.00\n  idempotencyKey: `topup-cart-${cartId}`,\n});\n"
      - lang: Java
        label: Java
        source: "JsonNode topup = client.request(\"POST\", \"/v1/topups\", Map.of(\n        \"user_id\"\
          , userId,\n        \"amount\", 5000L, // $50.00\n        \"gateway\", gateway), \"topup-cart-\"\
          \ + cartId);\n"
  /v1/topups/{topupId}:
    get:
      operationId: getTopup
      tags:
      - topups
      summary: Fetch a top-up intent
      parameters:
      - name: topupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Top-up intent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topup'
        default:
          $ref: '#/components/responses/Problem'
  /v1/topups/{topupId}/refresh:
    post:
      operationId: refreshTopup
      tags:
      - topups
      summary: Ask the gateway for a pending top-up's current outcome
      description: 'Reconciles one intent on demand: the gateway is asked what it thinks, and a terminal
        answer is applied through the same verified-confirmation path a webhook uses, so a credit can
        never happen twice. Use it when a webhook was missed or delayed; a settled intent is returned
        unchanged.'
