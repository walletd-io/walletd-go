      - fees
      - commission
      - refunded
      - net
      - subscribers
      properties:
        sales:
          type: integer
          format: int64
        gross:
          type: integer
          format: int64
        fees:
          type: integer
          format: int64
        commission:
          type: integer
          format: int64
        refunded:
          type: integer
          format: int64
        net:
          type: integer
          format: int64
        subscribers:
          type: integer
          format: int64
          description: Live mandates, counting active and past-due.
    ClientSales:
      type: object
      required:
      - summary
      - sales
      properties:
        summary:
          $ref: '#/components/schemas/ClientSalesSummary'
        sales:
          type: array
