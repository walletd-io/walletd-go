      tags:
      - catalog
      summary: The shop's imports, newest first
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
