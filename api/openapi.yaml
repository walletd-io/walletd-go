      - name: topupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Top-up intent after reconciliation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topup'
        default:
          $ref: '#/components/responses/Problem'
      x-codeSamples:
      - lang: curl
        label: curl
        source: "# Idempotent: the answer comes from the processor and lands through the\n# same confirmation\
          \ path a webhook uses, so this cannot double-credit.\ncurl -sS -X POST \"$WALLETD_API/v1/topups/$TOPUP_ID/refresh\"\
          \ \\\n  -H \"Authorization: Bearer $WALLETD_API_KEY\"\n"
      - lang: Go
        label: Go
        source: 'var topup walletd.Topup

          err := client.Do(ctx, http.MethodPost, "/v1/topups/"+topupID+"/refresh", nil, &topup, "")

          '
      - lang: Python
        label: Python
        source: 'topup = client.request("POST", f"/v1/topups/{topup_id}/refresh")

          '
      - lang: PHP
        label: PHP
        source: '$topup = $client->request(''POST'', "/v1/topups/{$topupId}/refresh");

          '
      - lang: JavaScript
        label: JavaScript
        source: 'const topup = await client.request("POST", `/v1/topups/${topupId}/refresh`);

          '
      - lang: Java
        label: Java
        source: 'JsonNode topup = client.request("POST", "/v1/topups/" + topupId + "/refresh", null, null);

          '
