            $ref: '#/components/schemas/ClientSale'
    CatalogClient:
      type: object
      required:
      - id
      - merchant_id
      - org_alias
      - display_name
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
        merchant_id:
          type: string
          format: uuid
        org_alias:
          type: string
        display_name:
          type: string
        category:
          type: string
        description:
          type: string
        logo_url:
          type: string
        commission_bps:
          type: integer
          minimum: 0
          maximum: 10000
          nullable: true
          description: Overrides the loop's commission rate for this client. Absent means no deal here
            and the loop's rate applies; zero means this client sells commission-free.
        status:
          $ref: '#/components/schemas/CatalogClientStatus'
        approved_at:
          type: string
          format: date-time
          description: When the platform first let this client publish. Absent while pending.
        created_at:
          type: string
          format: date-time
    OnboardClientRequest:
      type: object
      required:
      - display_name
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 128
        category:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 2048
        logo_url:
          type: string
          maxLength: 512
    ClientProfileRequest:
      type: object
      required:
      - display_name
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 128
        category:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 2048
        logo_url:
          type: string
          maxLength: 512
    Offering:
      type: object
      required:
      - id
      - client_id
      - kind
      - title
      - amount
      - options
      - variants
      - status
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - item
          - plan
        title:
          type: string
        description:
          type: string
        amount:
          type: integer
          format: int64
          description: The plan price, or for an item the lowest live variant price.
        interval:
          type: string
          enum:
          - weekly
          - monthly
        image_url:
          type: string
          maxLength: 512
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Whatever the vertical needs and the platform does not model.
        commission_bps:
          type: integer
          minimum: 0
          maximum: 10000
          nullable: true
          description: Overrides both the client's rate and the loop's for this one offering, which is
            how a promotion is priced.
        category_id:
          type: string
          format: uuid
          nullable: true
        options:
          type: array
          maxItems: 3
          items:
            type: string
          description: The product's variant axes (Size, Colour), in the order every variant lists its
            values. Empty for a single-variant item.
        markup:
          $ref: '#/components/schemas/Markup'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
          description: Live variants of an item; empty for plans.
        status:
          type: string
          enum:
          - draft
          - published
          - archived
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Markup:
      type: object
      required:
      - kind
      - value
      nullable: true
      description: 'What a merchant adds to a cost to reach a sell price. percent is basis points of the
        cost; fixed is minor units on top. Resolves most specific wins: variant, then product, then shop.'
      properties:
        kind:
          type: string
          enum:
          - percent
          - fixed
        value:
          type: integer
          format: int64
          minimum: 0
    Rounding:
      type: object
      required:
      - increment
      - offset
      description: Lands a derived price on a friendly number. increment is in minor units (100 puts a
        two-decimal currency on whole units, 0 disables rounding); offset nudges the result (-1 gives
        x.99).
      properties:
        increment:
          type: integer
          format: int64
          minimum: 0
        offset:
          type: integer
          format: int64
    Pricing:
      type: object
      required:
      - rounding
      description: A shop's pricing defaults for cost_plus variants.
      properties:
        markup:
          $ref: '#/components/schemas/Markup'
        rounding:
          $ref: '#/components/schemas/Rounding'
        repriced_variants:
          type: integer
          description: On a write, how many variants changed price as a result.
    VariantInventory:
      type: object
      required:
      - track_inventory
      - in_stock
      - low_stock
      description: Stock as the caller may see it. Shoppers get the three flags only; the merchant also
        gets the counts and the policy.
      properties:
        track_inventory:
          type: boolean
        in_stock:
          type: boolean
        low_stock:
          type: boolean
        on_hand:
          type: integer
          format: int64
        reserved:
          type: integer
          format: int64
        available:
          type: integer
          format: int64
        allow_backorder:
          type: boolean
        low_stock_threshold:
          type: integer
          format: int64
          nullable: true
    Variant:
      type: object
      required:
      - id
      - offering_id
      - option_values
      - position
      - amount
      - inventory
      - status
      - created_at
      - updated_at
      description: The sellable unit. cost_amount, markup and pricing_mode appear only to the merchant.
      properties:
        id:
          type: string
          format: uuid
        offering_id:
          type: string
          format: uuid
        sku:
          type: string
          maxLength: 64
        barcode:
          type: string
          maxLength: 64
        option_values:
          type: array
          maxItems: 3
          items:
            type: string
        position:
          type: integer
        pricing_mode:
          type: string
          enum:
          - manual
          - cost_plus
        cost_amount:
          type: integer
          format: int64
        markup:
          $ref: '#/components/schemas/Markup'
        amount:
          type: integer
          format: int64
        image_url:
          type: string
          maxLength: 512
        inventory:
          $ref: '#/components/schemas/VariantInventory'
        status:
          type: string
          enum:
          - active
          - archived
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    VariantInput:
      type: object
      description: A variant as the merchant writes it. amount is required in manual mode and ignored
        in cost_plus mode, where it derives from cost_amount and the most specific markup. initial_stock
        is honoured on create only; later counts change through the stock endpoint so the movement log
        is whole.
      properties:
        sku:
          type: string
          maxLength: 64
        barcode:
          type: string
          maxLength: 64
        option_values:
          type: array
          maxItems: 3
          items:
            type: string
            maxLength: 64
        position:
          type: integer
          minimum: 0
        pricing_mode:
          type: string
          enum:
          - manual
          - cost_plus
          default: manual
        cost_amount:
          type: integer
          format: int64
          minimum: 0
        markup:
          $ref: '#/components/schemas/Markup'
        amount:
          type: integer
          format: int64
          minimum: 1
        image_url:
          type: string
          maxLength: 512
        track_inventory:
          type: boolean
          default: false
        allow_backorder:
          type: boolean
          default: false
        low_stock_threshold:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        initial_stock:
          type: integer
          format: int64
          minimum: 0
    OfferingPage:
      type: object
      required:
      - offerings
      properties:
        offerings:
          type: array
          items:
            $ref: '#/components/schemas/Offering'
        next_cursor:
          type: string
          format: uuid
          description: Pass back as cursor for the next page; absent on the last page.
    StockAdjustmentRequest:
      type: object
      description: Exactly one of delta (signed change) or set_to (absolute count).
      properties:
        delta:
          type: integer
          format: int64
        set_to:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: string
          maxLength: 256
    StockAdjustmentResult:
      type: object
      required:
      - variant
      - movement
      properties:
        variant:
          $ref: '#/components/schemas/Variant'
        movement:
          $ref: '#/components/schemas/InventoryMovement'
    InventoryMovement:
