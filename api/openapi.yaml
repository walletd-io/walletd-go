      description: The tenant's negotiated marketplace commission for this one merchant, applied to every
        catalog sale it makes. It overrides the tenant's default commission rate; a per-offering rate
        still beats it. Requires fees:manage, the same authority as the tenant-wide fee plan; a merchant
        cannot set its own commission.
      parameters:
      - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetClientCommissionRequest'
      responses:
        '200':
          description: Commission set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogClient'
        default:
          $ref: '#/components/responses/Problem'
  /v1/clients/{clientId}/reward_rules:
    get:
      operationId: listClientRewardRules
      tags:
      - catalog
      summary: List this merchant's own cashback and loyalty rules
      parameters:
      - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: The merchant's rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RewardRule'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createClientRewardRule
      tags:
      - catalog
      summary: Set a cashback or loyalty rule for this merchant, common or per-product
      parameters:
      - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRewardRuleRequest'
      responses:
        '201':
          description: Rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardRule'
        default:
          $ref: '#/components/responses/Problem'
  /v1/clients/{clientId}/reward_rules/{ruleId}/disable:
    post:
      operationId: disableClientRewardRule
      tags:
      - catalog
      summary: Turn off one of this merchant's own rules
      description: Retires a rule the merchant owns, freeing its slot so a new rate can be set. Grants
        already made stand. A rule the merchant does not own is not found.
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - name: ruleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Rule disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardRule'
        default:
          $ref: '#/components/responses/Problem'
  /v1/tier_limits:
    get:
      operationId: listTierLimits
      tags:
      - limits
      summary: The tenant's configured tier caps (admin)
      responses:
        '200':
          description: Tier limits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TierLimits'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: setTierLimits
      tags:
      - limits
      summary: Upsert one tier's caps (audited; admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTierLimitsRequest'
      responses:
        '200':
          description: Stored tier limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TierLimits'
        default:
          $ref: '#/components/responses/Problem'
  /v1/users/{userId}/tier:
    post:
      operationId: setUserTier
      tags:
      - limits
      summary: Assign a user's limit tier (audited; admin)
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tier
              properties:
                tier:
                  type: string
                  minLength: 1
                  maxLength: 32
      responses:
        '200':
          description: Tier assigned
          content:
            application/json:
              schema:
                type: object
                required:
                - user_id
                - tier
                - previous
                properties:
                  user_id:
                    type: string
                    format: uuid
                  tier:
                    type: string
                  previous:
                    type: string
        default:
          $ref: '#/components/responses/Problem'
  /v1/clients/{clientId}/payouts:
    get:
      operationId: listClientPayouts
      tags:
      - payouts
      summary: The client's payout statement, newest first
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Payouts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payout'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: runClientPayout
      tags:
      - payouts
      summary: Pay out settlement money (books first, transfer follows)
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: integer
                  format: int64
                  minimum: 1
                  description: Omit for the full settlement balance
      responses:
        '201':
          description: Payout posted (and transferred when a rail is attached)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
        default:
          $ref: '#/components/responses/Problem'
      x-codeSamples:
      - lang: curl
        label: curl
        source: "# An empty body pays out the full settlement balance. Key on the payout\n# PERIOD, not\
          \ the moment, so a retry after a timeout pays once.\ncurl -sS -X POST \"$WALLETD_API/v1/clients/$CLIENT_ID/payouts\"\
          \ \\\n  -H \"Authorization: Bearer $TOKEN\" \\\n  -H \"Content-Type: application/json\" \\\n\
          \  -H \"Idempotency-Key: payout-2026-08-11-$CLIENT_ID\" \\\n  -d '{}'\n"
      - lang: Go
        label: Go
        source: "var payout walletd.Payout\nkey := \"payout-\" + period + \"-\" + clientID\nerr := client.Do(ctx,\
          \ http.MethodPost, \"/v1/clients/\"+clientID+\"/payouts\",\n    map[string]any{}, &payout, key)\n"
      - lang: Python
        label: Python
        source: "payout = client.request(\"POST\", f\"/v1/clients/{client_id}/payouts\", {},\n       \
          \                 idempotency_key=f\"payout-{period}-{client_id}\")\n"
      - lang: PHP
        label: PHP
        source: "$payout = $client->request('POST', \"/v1/clients/{$clientId}/payouts\", [],\n    \"payout-{$period}-{$clientId}\"\
          );\n"
      - lang: JavaScript
        label: JavaScript
        source: "const payout = await client.request(\"POST\", `/v1/clients/${clientId}/payouts`, {\n\
          \  body: {},\n  idempotencyKey: `payout-${period}-${clientId}`,\n});\n"
      - lang: Java
        label: Java
        source: "JsonNode payout = client.request(\"POST\", \"/v1/clients/\" + clientId + \"/payouts\"\
          ,\n        Map.of(), \"payout-\" + period + \"-\" + clientId);\n"
  /v1/orders:
    get:
      operationId: listOrders
      tags:
      - orders
      summary: The calling shopper's orders, newest first
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createOrder
      tags:
      - orders
      summary: Reserve a cart from one merchant at catalog prices
      description: Stock is reserved for each line (unless the variant does not track inventory or allows
        backorder) until the order is paid, canceled or expires. 422 insufficient_stock names the line
        that cannot be promised.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Open order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        default:
          $ref: '#/components/responses/Problem'
  /v1/orders/{orderId}:
    get:
      operationId: getOrder
      tags:
      - orders
      summary: One of the shopper's orders
      parameters:
      - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        default:
          $ref: '#/components/responses/Problem'
  /v1/orders/{orderId}/pay:
    post:
      operationId: payOrder
      tags:
      - orders
      summary: Pay an open order with one instant payment
      description: 'Idempotent by order: calling it again returns the same payment. A payment refusal
        (insufficient funds, limits) leaves the order open.'
      parameters:
      - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The paid order and its payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPayment'
        default:
          $ref: '#/components/responses/Problem'
  /v1/orders/{orderId}/cancel:
    post:
      operationId: cancelOrder
      tags:
      - orders
      summary: Cancel an open order and release its stock
      parameters:
      - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Canceled order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        default:
          $ref: '#/components/responses/Problem'
  /v1/explore/clients:
    get:
      operationId: exploreClients
      tags:
      - explore
      summary: Browse and search the client directory
      parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 128
      - name: category
        in: query
        schema:
          type: string
          maxLength: 64
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Active clients, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogClient'
        default:
          $ref: '#/components/responses/Problem'
  /v1/explore/clients/{clientId}:
    get:
      operationId: exploreClient
      tags:
      - explore
      summary: A client's public profile with its published offerings
      parameters:
      - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Client detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExploreClientDetail'
        default:
          $ref: '#/components/responses/Problem'
  /v1/explore/offerings/{offeringId}:
    get:
      operationId: exploreOffering
      tags:
      - explore
      summary: A published offering with its client
      parameters:
      - $ref: '#/components/parameters/OfferingId'
      responses:
        '200':
          description: Offering detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExploreOfferingDetail'
        default:
          $ref: '#/components/responses/Problem'
  /v1/explore/offerings/{offeringId}/purchase:
    post:
      operationId: purchaseOffering
      tags:
      - explore
      summary: Buy a one-off item; the catalog price is the only price
      parameters:
      - $ref: '#/components/parameters/OfferingId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Instant payment captured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        default:
          $ref: '#/components/responses/Problem'
  /v1/explore/offerings/{offeringId}/subscribe:
    post:
      operationId: subscribeOffering
      tags:
      - explore
      summary: Subscribe to a plan; amount and interval come from the catalog
      parameters:
      - $ref: '#/components/parameters/OfferingId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A tenant API key (`sk_{env}_{id}_{secret}`), a wallet user token, or an IdP access
        token. Which principal the credential resolves to decides the scopes it carries; see the authentication
        guide.
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    MerchantId:
      name: merchantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClientId:
      name: clientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OfferingId:
      name: offeringId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VariantId:
      name: variantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImportId:
      name: importId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KeyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EndpointId:
      name: endpointId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: Last seen id from the previous page
      schema:
        type: string
        format: uuid
    TenantFilter:
      name: tenant_id
      in: query
      description: Restrict a cross-tenant listing to one tenant
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
    Tenant:
      type: object
      required:
      - id
      - name
      - currency
      - status
      - fees
      - commission_mode
      - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        currency:
          type: string
        status:
          type: string
        fees:
          $ref: '#/components/schemas/FeeSchedule'
        commission_mode:
          $ref: '#/components/schemas/CommissionMode'
        created_at:
          type: string
          format: date-time
    CreateTenantRequest:
      type: object
      required:
      - name
      - currency
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        currency:
          type: string
          pattern: ^[A-Z]{3}$
    TenantSummary:
      type: object
      required:
      - tenant
      - rows
      - invariants_ok
      properties:
        tenant:
          $ref: '#/components/schemas/Tenant'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/SummaryRow'
        invariants_ok:
          type: boolean
        violations:
          type: array
          items:
            type: string
    PlatformOverview:
      type: object
      required:
      - tenants
      - totals
      - as_of
      properties:
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/PlatformTenantRow'
        totals:
          type: array
          items:
            $ref: '#/components/schemas/PlatformTotal'
        as_of:
          type: string
          format: date-time
    PlatformTenantRow:
      type: object
      description: One tenant's position. Amounts are minor units of the tenant's own currency; balanced
        says whether every commodity in this tenant's ledger nets to zero across all accounts.
      required:
      - tenant
      - users
      - transactions_30d
      - volume_30d
      - treasury
      - user_cash
      - merchant_settlement
      - subscriptions_active
      - balanced
      properties:
        tenant:
          $ref: '#/components/schemas/Tenant'
        users:
          type: integer
          format: int64
        transactions_30d:
          type: integer
          format: int64
        volume_30d:
          type: integer
          format: int64
        treasury:
          type: integer
          format: int64
        user_cash:
          type: integer
          format: int64
        merchant_settlement:
          type: integer
          format: int64
        subscriptions_active:
          type: integer
          format: int64
        balanced:
          type: boolean
    PlatformTotal:
      type: object
      description: Whole-platform sums for one currency, never across currencies.
      required:
      - currency
      - tenants
      - users
      - transactions_30d
      - volume_30d
      - treasury
      - user_cash
      - merchant_settlement
      properties:
        currency:
          type: string
        tenants:
          type: integer
          format: int64
        users:
          type: integer
          format: int64
        transactions_30d:
          type: integer
          format: int64
        volume_30d:
          type: integer
          format: int64
        treasury:
          type: integer
          format: int64
        user_cash:
          type: integer
          format: int64
        merchant_settlement:
          type: integer
          format: int64
    PlatformTransaction:
      type: object
      required:
      - id
      - tenant_id
      - tenant_name
      - type
      - status
      - legs
      - created_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        tenant_name:
          type: string
        type:
          type: string
        status:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        legs:
          type: array
          items:
            $ref: '#/components/schemas/TransactionLeg'
        created_at:
          type: string
          format: date-time
    PlatformUser:
      type: object
      required:
      - id
      - tenant_id
      - tenant_name
      - external_id
      - kind
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        tenant_name:
          type: string
        external_id:
          type: string
        kind:
          $ref: '#/components/schemas/UserKind'
        display_name:
          type: string
        handle:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
    PlatformSubscription:
      type: object
      required:
      - id
      - tenant_id
      - tenant_name
      - user_id
      - merchant_id
      - plan_name
      - amount
      - currency
      - interval
      - status
      - next_charge_at
      - retry_count
      - created_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        tenant_name:
          type: string
        user_id:
          type: string
          format: uuid
        merchant_id:
          type: string
          format: uuid
        plan_name:
          type: string
        amount:
          type: integer
          format: int64
        currency:
          type: string
        interval:
          $ref: '#/components/schemas/SubscriptionInterval'
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        next_charge_at:
          type: string
          format: date-time
        retry_count:
          type: integer
        created_at:
          type: string
          format: date-time
    EntryDirection:
      type: string
      enum:
      - debit
      - credit
    UserTransaction:
      type: object
      required:
      - txn_id
      - txn_type
      - purpose
      - direction
      - amount
      - commodity
      - created_at
      properties:
        txn_id:
          type: string
          format: uuid
        txn_type:
          type: string
        purpose:
          type: string
        direction:
          $ref: '#/components/schemas/EntryDirection'
        amount:
          type: integer
          format: int64
        commodity:
          type: string
        created_at:
          type: string
          format: date-time
    TransactionLeg:
      type: object
      required:
      - owner_type
      - purpose
      - direction
      - amount
      - commodity
      properties:
        owner_type:
          type: string
        owner_id:
          type: string
          format: uuid
        purpose:
          type: string
        direction:
          $ref: '#/components/schemas/EntryDirection'
        amount:
          type: integer
          format: int64
        commodity:
          type: string
    Transaction:
      type: object
      required:
      - id
      - type
      - status
      - legs
      - created_at
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        status:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        legs:
          type: array
          items:
            $ref: '#/components/schemas/TransactionLeg'
        created_at:
          type: string
          format: date-time
    SummaryRow:
      type: object
      required:
      - owner_type
      - purpose
      - commodity
      - balance
      - accounts
      properties:
        owner_type:
          type: string
        purpose:
          type: string
        commodity:
          type: string
        balance:
          type: integer
          format: int64
        accounts:
          type: integer
          format: int64
    FeeRule:
      type: object
      description: What one money path costs. The proportional part is basis points of the amount and
        rounds up; the flat part is minor units charged regardless of size; the result is then clamped
        into the [min_fee, max_fee] band. A fee taken out of the money never exceeds the amount it comes
        from.
      required:
      - bps
      - flat
      - min_fee
      properties:
        bps:
          type: integer
          minimum: 0
          maximum: 10000
        flat:
          type: integer
          format: int64
          minimum: 0
        min_fee:
          type: integer
          format: int64
          minimum: 0
        max_fee:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Absent means uncapped. A cap of zero makes the path free.
    FeeSchedule:
      type: object
      description: A tenant's price list, one rule per money path. An absent path charges nothing, so
        a tenant provisioned before a path existed stays free on it. Payments and subscriptions deduct
        their fee from the merchant's settlement; P2P adds it on top of what the sender pays; top-up deducts
        it from what is credited; payout deducts it from what leaves.
      properties:
        payment:
          $ref: '#/components/schemas/FeeRule'
        subscription:
          $ref: '#/components/schemas/FeeRule'
        commission:
          $ref: '#/components/schemas/FeeRule'
        p2p:
          $ref: '#/components/schemas/FeeRule'
        topup:
          $ref: '#/components/schemas/FeeRule'
        payout:
          $ref: '#/components/schemas/FeeRule'
    CommissionMode:
      type: string
      enum:
      - deduct
      - add
      description: Whether marketplace commission comes out of the merchant's settlement (the consumer
        pays the list price) or is added to what the consumer pays (the merchant nets the full list price).
    FeePlan:
      type: object
      required:
      - fees
      - commission_mode
      properties:
        fees:
          $ref: '#/components/schemas/FeeSchedule'
        commission_mode:
          $ref: '#/components/schemas/CommissionMode'
    UpdateFeePlanRequest:
