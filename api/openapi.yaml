        payment_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
          description: Set when the sale came through a cart order.
        offering_id:
          type: string
          format: uuid
          description: Absent when the sale did not come from the catalog.
        title:
          type: string
        amount:
          type: integer
          format: int64
        fee:
          type: integer
          format: int64
        commission:
          type: integer
          format: int64
        refunded:
          type: integer
          format: int64
        net:
          type: integer
          format: int64
          description: What reached settlement, so amount less fee, commission and refunds.
        status:
          type: string
        created_at:
          type: string
          format: date-time
    ClientSalesSummary:
      type: object
      required:
      - sales
