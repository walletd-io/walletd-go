      properties:
        txn_id:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
    SetClientCommissionRequest:
      type: object
      properties:
        commission_bps:
          type: integer
          minimum: 0
          maximum: 10000
          nullable: true
          description: The commission rate in basis points charged on this merchant's sales. Null clears
            the deal so the tenant's default rate applies; zero is a real rate meaning the merchant is
            sold commission-free.
      description: Only the rate is negotiable; the flat part and band stay with the tenant plan.
    ClientRewardRuleRequest:
      type: object
      properties:
        kind:
          type: string
          enum:
          - cashback
          - accrual
          default: cashback
          description: cashback pays money back from this merchant's own marketing pot; accrual grants
            tenant-issued loyalty points. Defaults to cashback.
        offering_id:
          type: string
          format: uuid
          description: When set, the rule applies only to this one product of the merchant and overrides
            the merchant's common rule of the same kind. Absent is the common rule that applies to all
            of the merchant's products.
        rate_bps:
          type: integer
          minimum: 0
          maximum: 100000
          description: Cashback rate in basis points (0-10000). For accrual this is the points-per-unit
            rate (1-100000).
        fixed:
          type: integer
          format: int64
          minimum: 0
          description: Flat cashback added on top of the rate. Cashback only.
        per_txn_cap:
          type: integer
          format: int64
          minimum: 0
        per_user_day_cap:
          type: integer
          format: int64
          minimum: 0
      description: Scope and funding are pinned to the calling merchant; the rule is either common (all
        products) or per-product, and either cashback or loyalty.
    ExploreClientDetail:
      type: object
      required:
      - client
      - offerings
      properties:
        client:
          $ref: '#/components/schemas/CatalogClient'
        offerings:
          type: array
          items:
            $ref: '#/components/schemas/Offering'
    ExploreOfferingDetail:
      type: object
      required:
      - offering
      - client
      properties:
        offering:
          $ref: '#/components/schemas/Offering'
        client:
          $ref: '#/components/schemas/CatalogClient'
    TierLimits:
      type: object
      required:
      - tier
      - max_balance
      - topup_per_day
      - p2p_per_day
      - updated_at
      properties:
        tier:
          type: string
        max_balance:
          type: integer
          format: int64
          description: 0 means unlimited
        topup_per_day:
          type: integer
          format: int64
          description: 0 means unlimited
        p2p_per_day:
          type: integer
          format: int64
          description: 0 means unlimited
        updated_at:
          type: string
          format: date-time
    SetTierLimitsRequest:
      type: object
      required:
      - tier
      properties:
        tier:
          type: string
          minLength: 1
          maxLength: 32
        max_balance:
          type: integer
          format: int64
          minimum: 0
        topup_per_day:
          type: integer
          format: int64
          minimum: 0
        p2p_per_day:
          type: integer
          format: int64
          minimum: 0
    Payout:
      type: object
      required:
      - id
      - merchant_id
      - amount
      - fee
      - txn_id
      - rail
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
        merchant_id:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          description: What left the merchant's settlement balance.
        fee:
          type: integer
          format: int64
          description: The part of the amount the wallet kept, so amount less fee is what the merchant
            receives.
        txn_id:
          type: string
          format: uuid
        rail:
          type: string
        external_ref:
          type: string
        status:
          type: string
          enum:
          - pending_transfer
          - completed
        created_at:
          type: string
          format: date-time
    TopupMethod:
      type: object
      required:
      - gateway
      - flow
      properties:
        gateway:
          type: string
        flow:
          type: string
          enum:
          - client_secret
          - redirect
          - dev
        currencies:
          type: array
          items:
            type: string
    TopupNextAction:
      type: object
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - client_secret
          - redirect
        client_secret:
          type: string
        redirect_url:
          type: string
